nav button{flex:0 0 calc((100% - 24px)/5);border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 2px;border-radius:12px;font-size:12px;line-height:1.15;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;overflow-wrap:anywhere}nav button i{font-style:normal;font-size:20px;line-height:1}

</style></head><body><div class="w">
<h1>🛡️ ניהול טנק</h1>
<div id="tk"></div><nav id="nav"></nav><div id="app"></div><div id="modal"></div></div>
<script>
const KEY='tank-v1';
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>{if(!s)return'';const p=s.split('-');return p[2]+'.'+p[1]};
const p2=n=>String(n).padStart(2,'0');
const fdt=t=>{const d=new Date(t);return fd(iso(d))+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AM=[['t','18 טען','s',[['חצב',6],['חלול',6],['תקול',1],['אלומיניום',5]]],['c','18 מפקד','s',[['חצב',3],['חלול',7],['כלנית',2],['אלומיניום',6]]],['f','5פ','s',[['חצב',2],['חלול',1],['כלנית',2]]],['x','מסריחים','s',[]],['m','ברוסים מאג','b',[['צריח עילית',27],['צריח תחתית',8],['מסדרון אחורי',8]]],['h','ברוסים 0.5','b',[['ברוס 0.5',2]]]];
const mkAm=full=>({g:AM.map(([id,name,kind,it])=>({id,name,kind,items:full?it.map(([n,q])=>({n,q})):[]})),fired:[],merged:true});
const def=()=>({tzach:'423',crew:'קמיליון',locs:['חוף','דוגית'],loc:'חוף',shaam:4554,km:7987,diesel:900,
faults:['מארז ב18 טען תקול (לא נכנס פגז) - מסתבר שהרכיבו אותו הפוך, צריך לפרק את המארזים ולתקן','זוהר תותח ומיקום עצמי נופל הרבה פעמים - ניתוק וחיבור j1 פותר את הבעייה לסירוגין','נורית חיווי ספקטרוניקס נהג לא עובדת','חסר קליפס 1 לאפיסקופ נהג','חסר גומי לאפיסקופ נהג מרכזי','משענת גב נהג לא מרופדת במלואה','רצועת מדף נהג מחוברת רק בבורג אחד למדף'],zivud:['עורפן מאג טען','נגע חולץ','לום','רצ׳ט','תאי זיווד 3+4','סלי תובה','חסר מטף כיבוי נהג'],kesher:[],klali:[],talat:'2026-10-22',tk:'2026-10-14',tafash:'2026-10-12',mtg:[],tItems:[],extras:[],stock:[],fixLog:[],req:{exit:[],gear:[],tank:[],gen:[],close:[]},ammo:mkAm(true)});
const newT=()=>Object.assign(def(),{faults:[],zivud:[],talat:iso(),tk:iso(),tafash:iso(),ammo:mkAm(false)});
let R,S;
try{const raw=JSON.parse(localStorage.getItem('tank-v2')||localStorage.getItem(KEY)||'null');
if(raw&&raw.tanks){R=raw;Object.keys(R.tanks).forEach(k=>{const o=R.tanks[k];R.tanks[k]=Object.assign(def(),o);if(!o.ammo)R.tanks[k].ammo=mkAm(k==='423');const hh=R.tanks[k].ammo.g.find(g=>g.id==='h');if(hh)hh.items.forEach(x=>{if(x.n==='ברוסים 0.5')x.n='ברוס 0.5'});R.tanks[k].req.gen=R.tanks[k].req.gen||[];R.tanks[k].req.close=R.tanks[k].req.close||[];['gear','tank'].forEach(q=>(R.tanks[k].req[q]||[]).forEach(x=>{if(x.st==='הוחלף')x.st='הושלם'}))})}
else if(raw){const id=/^\d{3}$/.test(raw.tzach||'')?raw.tzach:'423';R={cur:id,tanks:{[id]:Object.assign(def(),raw)}}}}catch(e){}
if(!R||!R.tanks||!Object.keys(R.tanks).length)R={cur:'423',tanks:{'423':def()}};
if(!R.tanks[R.cur])R.cur=Object.keys(R.tanks)[0];
Object.keys(R.tanks).forEach(k=>{const am=R.tanks[k].ammo;if(!am.g.some(g=>g.id==='x'))am.g.push({id:'x',name:'מסריחים',kind:'s',items:[]});
if(!am.merged){const mp={},out=[];(am.fired||[]).forEach(x=>{const d=new Date(x.ts),key=[x.g,x.n,x.k,iso(d),d.getHours()].join('|');if(mp[key])mp[key].q+=x.q;else{mp[key]=Object.assign({},x);out.push(mp[key])}});am.fired=out;am.merged=true}});
S=R.tanks[R.cur];
R.dept=R.dept||{};R.dept.raw=R.dept.raw||'';R.dept.events=R.dept.events||[];R.dept.bad=R.dept.bad||[];delete R.dept.items;
const save=()=>{try{localStorage.setItem('tank-v2',JSON.stringify(R))}catch(e){}try{cbAuto()}catch(e){}};
let tab='daily',sel=null,openWho=null,RD=null,MT=null,RS=false,DT=false,RT=false,RP=false,RDt=false,AD=null,EDF=null,EDX=null;
const nowL=()=>{const d=new Date();return iso(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const WHO=['מלבין','ליעד','גברי','זאב'];
const TABS={daily:'דוח יומי',tf:'טפ"ש',ex:'טיפולים נוספים',stock:'מלאי זיווד',full:'דוח מלא',req:'בקשות צוות',ammo:'דוח תחמושת',sched:'לוז יומי',mtg:'מתג 24'};

function datesBlock(){const l=[];if(S.talat)l.push('טלת מלא - '+fd(S.talat));if(S.tk)l.push('תכ. - '+fd(S.tk));if(S.tafash)l.push('טפש - '+fd(S.tafash));return l.length?'\n\n'+l.join('\n'):''}
function daily(){
return `${fd(RD||iso())}\nצ ${R.cur}\nמיקום ${S.loc}\nצוות ${S.crew}\n\nשע"מ ${S.shaam}\nק"מ ${S.km}\nסולר ${S.diesel}\n\nתקלות:\n${S.faults.map(x=>'• '+x).join('\n')}\n\nפערי זיווד:\n${S.zivud.join('\n')}\n\nפערים קשר:\n${S.kesher.join('\n')}\n\nפערים כללי:\n${S.klali.join('\n')}${datesBlock()}`}
function tfRep(){return `דוח טפ"ש${S.tafash?' - '+fd(S.tafash):''}\n`+(S.tItems.length?S.tItems.map(x=>(x.done?'✔ ':'✘ ')+x.t).join('\n'):'(אין פריטים)')}
function exRep(){return 'טיפולים נוספים שבוצעו:\n'+(S.extras.length?exOrd().map(({x})=>`• ${x.t} - ${fd(x.d)}`).join('\n'):'(אין פריטים)')}
const full=()=>daily()+'\n\n――――――――\n\n'+tfRep()+'\n\n――――――――\n\n'+exRep()+'\n\n――――――――\n\n'+fixRep()+'\n\n――――――――\n\n'+ammoRep();

function parse(t){
t=t.replace(/[\u200e\u200f\u2060\u202a-\u202e]/g,'');
const map={'תקלות':'faults','פערי זיווד':'zivud','פערים קשר':'kesher','פערים כללי':'klali'};
const n={faults:[],zivud:[],kesher:[],klali:[]},o={talat:'',tk:'',tafash:''},yr=new Date().getFullYear();
const dt=v=>{const m=v.match(/(\d{1,2})\.(\d{1,2})/);return m?yr+'-'+p2(m[2])+'-'+p2(m[1]):null};
let sec=null,m;
for(const raw0 of t.split('\n')){const raw=raw0.trim();if(!raw)continue;
const h=raw.replace(/:$/,'');
if(raw.endsWith(':')&&map[h]){sec=map[h];continue}
if(/^טלת מלא/.test(raw)){o.talat=dt(raw)||'';sec=null;continue}
if(/^תכ\./.test(raw)){o.tk=dt(raw)||'';sec=null;continue}
if(/^טפש/.test(raw)){o.tafash=dt(raw)||'';sec=null;continue}
if(sec===null){
if(m=raw.match(/^צ\s+(.+)$/)){o.tzach=m[1];continue}
if(m=raw.match(/^מיקום\s+(.+)$/)){o.loc=m[1];continue}
if(m=raw.match(/^צוות\s+(.+)$/)){o.crew=m[1];continue}
if(m=raw.match(/^שע["״]מ\s+(\d+)/)){o.shaam=+m[1];continue}
if(m=raw.match(/^ק["״]מ\s+(\d+)/)){o.km=+m[1];continue}
if(m=raw.match(/^סולר\s+(\d+)/)){o.diesel=+m[1];continue}
continue}
n[sec].push(raw.replace(/^[•\-–*·\s]+/,''));
}
if(o.tzach){const id=o.tzach.trim();if(/^\d{3}$/.test(id)){if(!R.tanks[id])R.tanks[id]=newT();R.cur=id;S=R.tanks[id]}delete o.tzach}
Object.keys(o).forEach(k=>{if(o[k]!=null)S[k]=o[k]});
Object.assign(S,n);
if(S.loc&&!S.locs.includes(S.loc))S.locs.push(S.loc);
save();render();
}

function cp(id){const e=document.getElementById(id);e.focus();e.select();
try{navigator.clipboard.writeText(e.value).catch(()=>document.execCommand('copy'))}catch(x){document.execCommand('copy')}
const b=event.target,t=b.textContent;b.textContent='✓ הועתק';setTimeout(()=>b.textContent=t,1200)}
const val=id=>document.getElementById(id).value.trim();
function clrDates(){if(!RDt){RDt=true;render();return}S.talat='';S.tk='';S.tafash='';RDt=false;save();render()}
function setF(k,v){S[k]=v;save();if(k==='tafash'||k==='tf')render();else upd()}
function setN(k,v){S[k]=parseInt(v)||0;save();render()}
function st(k,d){S[k]=(S[k]||0)+d;save();render()}
function addL(k){const v=val('in-'+k);if(!v)return;S[k].push(v);save();render()}
function delL(k,i){const v=S[k].splice(i,1)[0];
if(k==='zivud'){const n=nm(v);if(n&&!S.stock.some(x=>nm(x)===n))S.stock.push(n)}
if(k==='faults'){const ts=Date.now();const e=S.fixLog.find(x=>x.t===v&&x.status==='לא נפתר');
if(e){e.status='נפתר';e.hist.push({st:'נפתר',ts})}else S.fixLog.push({t:v,status:'נפתר',hist:[{st:'נפתר',ts}]})}
EDF=null;save();render()}
function editF(i){EDF=i;render()}
function saveF(i){const v=val('ef');if(v){const old=S.faults[i];S.faults[i]=v;S.fixLog.forEach(e=>{if(e.t===old&&e.status==='לא נפתר')e.t=v})}EDF=null;save();render()}
function setFix(i,st){const e=S.fixLog[i];if(e.status===st)return;e.status=st;e.hist.push({st,ts:Date.now()});
if(st==='לא נפתר'){if(!S.faults.includes(e.t))S.faults.push(e.t)}else S.faults=S.faults.filter(x=>x!==e.t);save();render()}
function setWhy(i,j,v){S.fixLog[i].hist[j].why=v.trim();save()}
function editFix(i){EDX=i;render()}
function saveFix(i){const v=val('efx');if(v){const e=S.fixLog[i],old=e.t;e.t=v;if(e.status==='לא נפתר')S.faults=S.faults.map(x=>x===old?v:x)}EDX=null;save();render()}
function delFix(i){S.fixLog.splice(i,1);save();render()}
const lastTs=e=>e.hist.length?e.hist[e.hist.length-1].ts:0;
const exOrd=()=>S.extras.map((x,i)=>({x,i})).sort((a,b)=>b.x.d.localeCompare(a.x.d)||b.i-a.i);
const fxOrd=()=>S.fixLog.map((e,i)=>({e,i})).sort((a,b)=>lastTs(b.e)-lastTs(a.e)||b.i-a.i);
function fixRep(){return 'תקלות שטופלו:\n'+(S.fixLog.length?fxOrd().map(({e})=>`• ${e.t}\n`+e.hist.map(h=>`   ${h.st} - ${fdt(h.ts)}`+(h.why?`\n   סיבה: ${h.why}`:'')).join('\n')).join('\n'):'(אין פריטים)')}
const RQ={exit:['בקשות יציאה','שלום לושינסקי, להלן בקשות יציאה עדכניים לצוות:',['בהמתנה','אושרה','לא אושרה','בוטל']],gear:['ציוד בלאי - צוות','רס"פ יקר, להלן בקשות הצוות להחלפת בלאי:',['בהמתנה','חסר','בהכנה','יצא להפצה','מוכן לאיסוף','הושלם','בוטל']],tank:['ציוד טנקאי בלאי','רס"פ יקר, להלן כלים טנקאיים להחלפת בלאי:',['בהמתנה','הושלם','בוטל']],gen:['ציוד כללי','רס"פ יקר, להלן בקשות לציוד כללי:',['בהמתנה','הושלם','בוטל']],close:['בקשות סגירה','',['בהמתנה','אושרה','לא אושרה','בוטל']]};
const REQW=['זאב','ליעד','גברי','מלבין'];
const fdf=s=>{const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)};
const rl=(k,x)=>(k==='exit'||k==='close')&&x.who?`${x.who}: ${fdf(x.from)}-${fdf(x.to)}`:x.t;
const fts=t=>{const d=new Date(t);return fdf(iso(d))+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const SG={exit:'שלום לושינסקי, להלן בקשת יציאה עדכנית לצוות:',gear:'רס"פ יקר, להלן בקשת הצוות להחלפת בלאי:',tank:'רס"פ יקר, להלן כלי טנקאי להחלפת בלאי:',gen:'רס"פ יקר, להלן בקשה לציוד כללי:'};
const intro=(k,n)=>((n===1&&SG[k])||RQ[k][1]).replace('רס"פ יקר,','שלום '+(R.rasap||'רביב')+',');
const stk=n=>n===1?'נבקש לעדכן האם הפריט קיים במלאי.':'נבקש לעדכן האם הפריטים קיימים במלאי.';
const listMsg=(k,xs)=>{const n=xs.length;if(k==='gear'){const by={};xs.forEach(x=>(by[x.who||'']=by[x.who||'']||[]).push(x.t));return intro('gear',n)+'\n'+[...REQW,''].filter(w=>by[w]).map(w=>(w?w+':\n':'')+by[w].map(t=>'• '+t).join('\n')).join('\n')+'\n'+stk(n)}
return intro(k,n)+'\n'+xs.map(x=>'• '+rl(k,x)+((k==='exit'||k==='close')&&x.why?' - סיבה: '+x.why:'')).join('\n')+'\n'+(k==='exit'?(n===1?'נבקש לעדכן האם הבקשה מאושרת.':'נבקש לעדכן האם הבקשות מאושרות.'):stk(n))};
const msgGear=()=>listMsg('gear',S.req.gear.filter(x=>x.sel));
const msgK=k=>listMsg(k,S.req[k].filter(x=>x.sel));
const rsel=k=>S.req[k].filter(x=>x.sel).map(x=>'• '+rl(k,x)).join('\n');
const msgExit=()=>listMsg('exit',S.req.exit.filter(x=>x.sel));
const msgWear=()=>{const g=rsel('gear'),t=rsel('tank');if(g&&t)return RQ.gear[1]+'\n'+g+'\n\nלהלן כלים טנקאיים להחלפת בלאי:\n'+t;return t?RQ.tank[1]+'\n'+t:RQ.gear[1]+'\n'+g};
function addR(k){const o={st:'בהמתנה',sel:false};
if(k==='exit'){o.who=val('rw-exit');o.from=val('rf-exit')||iso();o.to=val('rt-exit')||o.from}
else{const v=val('rq-'+k);if(!v)return;o.t=v;if(k==='gear')o.who=val('rw-gear')}
